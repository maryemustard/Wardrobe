[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# The image's CMD runs `alembic upgrade head` before starting uvicorn.
# DATABASE_URL must be set (reference it from the Railway PostgreSQL plugin).
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
