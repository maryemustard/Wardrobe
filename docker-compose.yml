# Local development stack. Not used by Railway.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: wardrobe
      POSTGRES_DB: wardrobe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://wardrobe:wardrobe@db:5432/wardrobe
      JWT_SECRET: dev-secret
      CORS_ORIGINS: http://localhost:5173
      ENVIRONMENT: dev
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://api:8000
    volumes:
      - ./frontend:/web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
